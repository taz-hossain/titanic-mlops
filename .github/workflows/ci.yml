name: Titanic MLOps CI/CD

on:
  push:
    branches: [main]
    paths: ["data/**", "src/**", "api/**", "tests/**", "params.yaml", "requirements.txt"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   
  workflow_dispatch:      

jobs:
  train-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get data
        run: |
          if [ ! -f data/raw/titanic.csv ]; then
            pip install gdown
            gdown 14cE-w5ilE2zMPz4cPVaxQLkBPSTQJLfT -O data/raw/titanic.csv
          fi

      - name: Run pipeline (preprocess -> train -> test -> deploy -> monitor)
        env:
          API_KEY: ${{ secrets.API_KEY || 'ci-test-key' }}
        run: python run_pipeline.py

      - name: Drift check on simulated new data
        run: python src/monitor.py --source drifted || true

      - name: Upload model, metrics and monitoring reports
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/production/
            models/metrics.json
            reports/